<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1c33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinstripe Prep">
<title>Pinstripe Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1c33; --navy2:#132b4d; --ink:#e9eef6; --dim:#9fb0c8; --stripe:rgba(255,255,255,.045);
  --gold:#f3c552; --red:#e0474c; --green:#3ecf7a; --grass:#1f6b3a; --dirt:#b8743f;
  --card:#f7f4ec; --cardInk:#1a1f2b; --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--navy);
  background-image:repeating-linear-gradient(90deg,transparent 0 34px,var(--stripe) 34px 36px);
  color:var(--ink); font-family:Inter,system-ui,sans-serif; overflow-x:hidden;
}
.bebas{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.04em}
button{font:inherit;cursor:pointer;border:0}
.screen{display:none;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:760px;margin:0 auto;position:relative}
.screen.on{display:block}

/* ---------- TITLE ---------- */
#title{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
#title.on{display:flex}
.lights{position:fixed;inset:0;pointer-events:none;z-index:0}
.light{position:absolute;top:-40px;width:260px;height:120vh;background:radial-gradient(ellipse at top,rgba(255,250,220,.22),transparent 60%);opacity:0;filter:blur(6px)}
.light.l1{left:-60px;transform:rotate(18deg);transform-origin:top}
.light.l2{right:-60px;transform:rotate(-18deg);transform-origin:top}
.lit .light{animation:flick 1.6s forwards}
.lit .light.l2{animation-delay:.45s}
@keyframes flick{0%{opacity:0}10%{opacity:.9}14%{opacity:.1}22%{opacity:1}30%{opacity:.4}40%,100%{opacity:1}}
.title-inner{position:relative;z-index:1}
.kicker{color:var(--gold);font-size:14px;letter-spacing:.35em;text-transform:uppercase;opacity:0;animation:rise .8s .9s forwards}
.logo{font-size:clamp(64px,19vw,132px);line-height:.85;margin:10px 0 4px;opacity:0;animation:slam .7s 1.3s cubic-bezier(.2,1.6,.4,1) forwards;text-shadow:0 6px 0 #000,0 0 40px rgba(243,197,82,.25)}
.logo span{color:var(--gold)}
.sub{color:var(--dim);font-size:15px;max-width:420px;margin:0 auto;opacity:0;animation:rise .8s 2s forwards}
.nowbat{margin:18px 0 12px;opacity:0;animation:rise .8s 2.5s forwards}
.nowbat small{display:block;color:var(--dim);letter-spacing:.3em;font-size:12px}
.nowbat b{font-family:"Bebas Neue";font-size:44px;letter-spacing:.08em}
.menu{display:grid;gap:10px;width:min(360px,100%);margin:0 auto;opacity:0;animation:rise .8s 2.9s forwards}
.btn{padding:15px 18px;border-radius:12px;background:var(--navy2);color:var(--ink);border:1px solid var(--line);font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--gold);color:#1a1300;border-color:transparent;font-size:18px}
.btn small{font-weight:600;opacity:.7;font-size:12px}
.btn .badge{background:var(--red);color:#fff;border-radius:99px;padding:2px 8px;font-size:12px}
.avg{margin-top:20px;color:var(--dim);font-size:13px;opacity:0;animation:rise .8s 3.2s forwards}
.avg b{color:var(--ink);font-family:"Bebas Neue";font-size:22px;letter-spacing:.05em}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slam{from{opacity:0;transform:scale(2.4)}to{opacity:1;transform:none}}
.mute{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));right:12px;z-index:50;background:rgba(0,0,0,.35);color:var(--ink);border-radius:99px;width:40px;height:40px;font-size:18px}

/* ---------- GAME ---------- */
.board{background:#050b14;border:2px solid #22324a;border-radius:10px;padding:8px 10px;font-family:"Bebas Neue";letter-spacing:.06em;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.line{display:grid;grid-template-columns:64px repeat(var(--inn),1fr) 34px;gap:2px;align-items:center;font-size:18px;text-align:center}
.line .tm{text-align:left;color:var(--dim)}
.line.hdr{color:#5d6f89;font-size:13px}
.line .r{color:var(--gold)}
.line .cur{background:rgba(243,197,82,.15);border-radius:4px}
.line.nyy .tm{color:#fff}
.status{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 10px;gap:10px}
.diamond{width:74px;height:74px;flex:none}
.diamond .base{fill:#26364f;stroke:#4b5f7e;stroke-width:1.5;transition:fill .3s}
.diamond .base.on{fill:var(--gold);stroke:#fff}
.outs{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12px;letter-spacing:.2em}
.outs i{width:13px;height:13px;border-radius:50%;border:2px solid #4b5f7e;display:inline-block}
.outs i.on{background:var(--red);border-color:var(--red)}
.clock{font-family:"Bebas Neue";font-size:34px;min-width:64px;text-align:right;line-height:1}
.clock small{display:block;font-size:11px;color:var(--dim);letter-spacing:.2em}
.clock{background:transparent;color:var(--ink);padding:0;cursor:pointer}
.clock .tap{font-size:9px;opacity:.6;letter-spacing:.1em}
.clock.hot{color:var(--gold)} .clock.late{color:var(--red);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.55}}
.inning-tag{font-family:"Bebas Neue";font-size:20px;letter-spacing:.08em}
.inning-tag small{display:block;font-family:Inter;font-size:11px;color:var(--dim);letter-spacing:.15em}

.card{background:var(--card);color:var(--cardInk);border-radius:14px;padding:18px 18px 16px;box-shadow:0 14px 40px rgba(0,0,0,.45);position:relative;animation:deal .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes deal{from{opacity:0;transform:translateY(30px) rotate(-1.5deg)}to{opacity:1;transform:none}}
.card .meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a8190;margin-bottom:10px;gap:8px}
.card .meta b{color:#0b1c33}
.card .newp{color:#fff;background:#0b1c33;padding:2px 7px;border-radius:4px;font-weight:800}
.card .skill{font-size:12px;color:#7a8190;margin:-4px 0 10px;font-style:italic}
.passage{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:1.6;margin:0 0 14px}
.passage u{text-decoration-thickness:2px;text-underline-offset:4px}
.passage .num{display:inline-block;font-family:Inter;font-size:12px;font-weight:800;border:1.5px solid #1a1f2b;border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:2px}
.stem{font-weight:600;font-size:15px;margin:0 0 12px}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid #d9d4c6;border-radius:10px;padding:12px 12px;color:var(--cardInk);font-family:"Source Serif 4",Georgia,serif;font-size:17px;transition:transform .1s,border-color .2s,background .2s}
.choice:active{transform:scale(.985)}
.choice .L{font-family:Inter;font-weight:800;font-size:13px;min-width:24px;height:24px;border-radius:50%;background:#0b1c33;color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.choice.right{border-color:var(--green);background:#e9faf0}
.choice.right .L{background:var(--green)}
.choice.wrong{border-color:var(--red);background:#fdecec}
.choice.wrong .L{background:var(--red)}
.choice.trapmark::after{content:"THE TRAP";font-family:Inter;font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--red);margin-left:auto;align-self:center}
.choices.locked .choice{pointer-events:none}
.choices.locked .choice:not(.right):not(.wrong){opacity:.55}

.film{margin-top:14px;border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.5;animation:rise .4s}
.film.good{background:#0f3a26;border:1px solid #1d6b45}
.film.bad{background:#3a1215;border:1px solid #7a2a2f}
.film h4{margin:0 0 6px;font-family:"Bebas Neue";font-size:22px;letter-spacing:.06em;font-weight:400}
.film p{margin:6px 0}
.film .tip{color:var(--gold);font-size:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:8px;margin-top:10px}
.next{margin-top:12px;width:100%}

/* ---------- CINEMATIC OVERLAY ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;display:grid;place-items:center}
.call{font-family:"Bebas Neue";font-size:clamp(56px,17vw,120px);line-height:.9;text-align:center;text-shadow:0 6px 0 #000,0 0 30px rgba(0,0,0,.6);animation:call 1.7s forwards}
.call small{display:block;font-family:Inter;font-weight:800;font-size:clamp(13px,3.6vw,18px);letter-spacing:.25em;color:#fff;text-shadow:0 2px 6px #000;margin-top:8px}
.call.hr{color:var(--gold)} .call.hit{color:#fff} .call.k{color:var(--red)}
@keyframes call{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.1)}}
.ball{position:fixed;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 30px rgba(255,255,255,.6);left:50%;bottom:22%}
.flash{position:fixed;inset:0;background:#fff;animation:flash .5s forwards}
@keyframes flash{from{opacity:.8}to{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.banner{position:fixed;left:0;right:0;top:38%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.85) 15%,rgba(0,0,0,.85) 85%,transparent);text-align:center;padding:18px 10px;animation:banner 2.2s forwards;z-index:45}
.banner b{font-family:"Bebas Neue";font-size:clamp(40px,11vw,74px);letter-spacing:.06em;color:var(--gold);display:block;line-height:1}
.banner span{color:var(--ink);letter-spacing:.25em;font-size:13px;text-transform:uppercase}
@keyframes banner{0%{opacity:0;transform:scaleY(0)}10%{opacity:1;transform:scaleY(1)}85%{opacity:1}100%{opacity:0}}

/* ---------- END / STATS ---------- */
.big{font-family:"Bebas Neue";font-size:clamp(64px,20vw,120px);line-height:.9;text-align:center;margin:30px 0 6px}
.big.win{color:var(--gold)} .big.loss{color:#8aa0bf}
.final{text-align:center;font-family:"Bebas Neue";font-size:40px;letter-spacing:.06em}
.center{text-align:center;color:var(--dim)}
.panel{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0}
.panel h3{margin:0 0 10px;font-family:"Bebas Neue";font-weight:400;font-size:24px;letter-spacing:.06em;color:var(--gold)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row .bar{grid-column:1/-1;height:6px;background:#22324a;border-radius:9px;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.row .bar i.mid{background:var(--gold)} .row .bar i.low{background:var(--red)}
.row .ba{font-family:"Bebas Neue";font-size:20px;letter-spacing:.04em}
.row .note{grid-column:1/-1;color:var(--dim);font-size:12.5px}
.back{background:transparent;color:var(--dim);padding:8px 0;font-weight:600}
h2.bebas{font-size:40px;margin:8px 0 0;font-weight:400}
.trip{border-top:1px solid var(--line);padding:10px 0}
.trip:first-of-type{border-top:0}
.trip-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.trip-top span{color:var(--dim);font-size:12px;white-space:nowrap}
.trip-ans{font-size:12.5px;color:var(--dim);margin-top:4px}
.trip-btns{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.trip-btns button{background:var(--navy2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600}
.trip.hit .trip-top b{color:var(--green)} .trip.miss .trip-top b{color:var(--red)}
/* ---------- ABOUT / REPORT CARD ---------- */
.snap{background:var(--gold);color:#1a1300;border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;margin-bottom:6px}
.lede{font-size:16px;line-height:1.55;margin:6px 0 14px}
.lede b{color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.tile b{display:block;font-family:"Bebas Neue";font-size:28px;letter-spacing:.03em;font-weight:400}
.tile b small{font-size:16px;color:var(--dim)}
.tile span{font-size:11px;color:var(--dim);line-height:1.3}
h3.sec{font-family:"Bebas Neue";font-weight:400;font-size:26px;letter-spacing:.05em;color:var(--gold);margin:22px 0 4px}
.fine{font-size:12.5px;color:var(--dim);line-height:1.45;margin:4px 0}
#about details>summary{list-style:none;cursor:pointer}
#about details>summary::-webkit-details-marker{display:none}
.fam{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.fam>summary .bar,.code-row>summary .bar{margin:6px 0 2px}
.fam-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fam-top b{font-size:16px}
.fam-top::after{content:"▸";color:var(--dim);font-size:12px;transition:transform .2s}
details[open]>summary>.fam-top::after{transform:rotate(90deg)}
.ba{font-family:"Bebas Neue";font-size:24px;letter-spacing:.04em;margin-left:auto}
.ba.sm{font-size:19px}
#about .bar{height:6px;background:#22324a;border-radius:9px;overflow:hidden}
#about .bar i{display:block;height:100%;background:var(--green);border-radius:9px}
#about .bar i.mid{background:var(--gold)} #about .bar i.low{background:var(--red)}
.fam-body{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.split{display:flex;gap:10px;font-size:13px;margin:4px 0}
.split span{flex:1;background:var(--navy2);border-radius:8px;padding:7px 9px}
.split b{font-family:"Bebas Neue";font-size:18px;font-weight:400;letter-spacing:.04em}
.split i{color:var(--dim);font-style:normal;font-size:11.5px}
.code-row{border-top:1px solid var(--line);padding:9px 0}
.code{display:inline-block;background:#22324a;border-radius:5px;padding:1px 6px;font-size:11.5px;font-weight:800;letter-spacing:.03em;color:var(--ink)}
.q{border-top:1px solid var(--line);padding:8px 0 8px 6px}
.q>summary{display:flex;gap:10px;align-items:center;font-size:13.5px}
.dots{display:flex;gap:3px;flex:none;min-width:40px}
.dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dots i.y{background:var(--green)} .dots i.n{background:var(--red)}
.qlabel{color:var(--ink)}
.qbody{background:var(--card);color:var(--cardInk);border-radius:10px;padding:12px;margin:8px 0 4px}
.qbody .fine{color:#5a6070}
.qbody a{color:#1f4e8c}
.qp{font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.5;margin:0 0 8px}
.qc{display:flex;justify-content:space-between;gap:8px;font-family:"Source Serif 4",Georgia,serif;font-size:15px;padding:4px 6px;border-radius:6px}
.qc.ok{background:#e9faf0;font-weight:600}
.prose{font-size:14.5px;line-height:1.55}
.prose p{margin:6px 0}
.prose details{border-top:1px solid var(--line);padding:9px 0}
.prose summary{color:var(--ink)}
.prose summary::before{content:"▸ ";color:var(--dim)}
.prose details[open] summary::before{content:"▾ "}
.prose a,.fine a{color:var(--gold)}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}}

.clockpick{display:flex;gap:6px;justify-content:center;margin:0 auto;flex-wrap:wrap;opacity:0;animation:rise .8s 3.1s forwards}
.clockpick button{background:var(--navy2);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:12.5px;font-weight:600}
.clockpick button.on{background:var(--ink);color:var(--navy)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pick button{background:var(--navy2);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600}
.pick button.on{background:var(--gold);color:#1a1300}
</style>
</head>
<body>
<button class="mute" id="mute" aria-label="Sound on or off">🔊</button>
<div id="fx"></div>

<!-- TITLE -->
<section id="title" class="screen on">
  <div class="lights"><div class="light l1"></div><div class="light l2"></div></div>
  <div class="title-inner">
    <div class="kicker">The Bronx · ACT English</div>
    <div class="logo bebas">PINSTRIPE<br><span>PREP</span></div>
    <p class="sub">Every pitch comes from a question you missed on a practice ACT: the same trap again, or the same skill from a new angle. Lay off the bad ones.</p>
    <div class="nowbat"><small>NOW BATTING</small><b>LEVI</b></div>
    <div class="clockpick" id="clockPick"></div>
    <div class="menu" style="margin-top:12px">
      <button class="btn primary" data-go="quick">PLAY BALL <small>3 innings · 9 at-bats</small></button>
      <button class="btn" data-go="full">The Full Nine <small>9 innings · 27 at-bats</small></button>
      <button class="btn" data-go="bp">Batting Practice <small>one rule, no score</small></button>
      <button class="btn" data-go="filmroom">Film Room <span class="badge" id="filmCount">0</span></button>
      <button class="btn" data-go="road">Road Trip <small>real ACT questions</small></button>
      <button class="btn" data-go="scout">Scouting Report <small>your numbers</small></button>
      <button class="btn" data-go="about">About & Report Card <small>for Levi and Mark</small></button>
    </div>
    <div class="avg">Season average <b id="seasonAvg">.000</b> · Record <b id="record">0–0</b></div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="board" id="board"></div>
  <div class="status">
    <div class="inning-tag" id="inningTag"></div>
    <svg class="diamond" viewBox="0 0 74 74" aria-hidden="true">
      <rect class="base" id="b2" x="30" y="6" width="14" height="14" transform="rotate(45 37 13)"/>
      <rect class="base" id="b3" x="6" y="30" width="14" height="14" transform="rotate(45 13 37)"/>
      <rect class="base" id="b1" x="54" y="30" width="14" height="14" transform="rotate(45 61 37)"/>
      <path d="M37 58 l7 6 v6 h-14 v-6z" fill="#e9eef6"/>
    </svg>
    <div>
      <div class="outs">OUTS <i id="o1"></i><i id="o2"></i><i id="o3"></i></div>
    </div>
    <button class="clock" id="clock" aria-label="Pitch clock: tap to change timing mode"><small id="clockLabel">PITCH CLOCK</small><span id="clockN">42</span><small class="tap">tap to change</small></button>
  </div>
  <div id="stage"></div>
</section>

<!-- END -->
<section id="end" class="screen"></section>
<!-- STATS -->
<section id="scout" class="screen"></section>
<!-- ABOUT / REPORT CARD -->
<section id="about" class="screen"></section>
<!-- ROAD TRIP -->
<section id="road" class="screen"></section>
<!-- BATTING PRACTICE PICKER -->
<section id="bp" class="screen"></section>

<script src="questions.js?v=6"></script>
<script src="cousins.js?v=6"></script>
<script src="officials.js?v=6"></script>
<script src="about.js?v=6"></script>
<script src="game.js?v=6"></script>
</body>
</html>
